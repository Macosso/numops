<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1000"
     height="1155"
     viewBox="0 0 1000 1155"
     role="img"
     aria-labelledby="title description">
  <title id="title">numops package logo</title>
  <desc id="description">
    A navy hexagonal badge with teal bounds, a diagonal vector arrow,
    six coral matrix points, and the lowercase word numops.
  </desc>

  <defs>
    <marker id="arrowhead"
            markerWidth="50"
            markerHeight="50"
            refX="42"
            refY="25"
            orient="auto"
            markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 50 25 L 0 50 Z" fill="#20D6C7"/>
    </marker>
  </defs>

  <!-- Transparent canvas outside the hexagon. -->
  <polygon
    points="500,24 946,282 946,873 500,1131 54,873 54,282"
    fill="#082E52"
    stroke="#20D6C7"
    stroke-width="28"
    stroke-linejoin="round"/>

  <!-- Inclusive lower and upper bounds. -->
  <g fill="#20D6C7" stroke="#20D6C7" stroke-linecap="round">
    <line x1="276" y1="277" x2="276" y2="660" stroke-width="18"/>
    <circle cx="276" cy="277" r="28" stroke="none"/>
    <circle cx="276" cy="660" r="28" stroke="none"/>

    <line x1="724" y1="277" x2="724" y2="660" stroke-width="18"/>
    <circle cx="724" cy="277" r="28" stroke="none"/>
    <circle cx="724" cy="660" r="28" stroke="none"/>
  </g>

  <!-- A compact matrix/vector motif. -->
  <g fill="#FF6B61">
    <circle cx="392" cy="356" r="20"/>
    <circle cx="500" cy="356" r="20"/>
    <circle cx="608" cy="356" r="20"/>
    <circle cx="392" cy="565" r="20"/>
    <circle cx="500" cy="565" r="20"/>
    <circle cx="608" cy="565" r="20"/>
  </g>

  <!-- Numerical transformation: interpolation, remapping, normalization. -->
  <line
    x1="333"
    y1="619"
    x2="675"
    y2="411"
    stroke="#20D6C7"
    stroke-width="20"
    stroke-linecap="round"
    marker-end="url(#arrowhead)"/>

  <!-- Package wordmark. -->
  <text
    x="500"
    y="915"
    fill="#F8FBFF"
    font-family="DejaVu Sans, Arial, sans-serif"
    font-size="158"
    font-weight="700"
    letter-spacing="-6"
    text-anchor="middle">numops</text>
</svg>
